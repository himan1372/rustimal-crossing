[Keyboard]
# Key names use SDL2 scancode names.
# Common names: Space, Left Shift, Right Shift, Left Ctrl, Right Ctrl,
#   Left Alt, Right Alt, Return, Escape, Tab, Backspace, Delete,
#   A-Z, 0-9, F1-F12, Up, Down, Left, Right, etc.
# Mouse buttons: Mouse1 (left), Mouse2 (right), Mouse3 (middle)
# For the full list, search the SDL2 scancode name table.

# Buttons
A = Space
B = Left Shift
X = X
Y = Y
Start = Return
Z = Z
L = Q
R = E

# Main Stick
Stick_Up = W
Stick_Down = S
Stick_Left = A
Stick_Right = D

# C-Stick (Camera)
CStick_Up = Up
CStick_Down = Down
CStick_Left = Left
CStick_Right = Right

# D-Pad
DPad_Up = I
DPad_Down = K
DPad_Left = J
DPad_Right = L

[Gamepad]
# SDL2 game controller names: a, b, x, y, start, leftshoulder,
#   rightshoulder, lefttrigger, righttrigger, leftstick, rightstick,
#   dpup, dpdown, dpleft, dpright. Use 'none' to unbind.
# Sticks are fixed: left stick = movement, right stick = C-stick.
# The Back/Select button is reserved: it opens the pause menu.
Pad_A = a
Pad_B = b
Pad_X = x
Pad_Y = y
Pad_Start = start
Pad_Z = rightshoulder
Pad_L = lefttrigger
Pad_R = righttrigger
Pad_DPad_Up = dpup
Pad_DPad_Down = dpdown
Pad_DPad_Left = dpleft
Pad_DPad_Right = dpright
