[Graphics]
# Window size (ignored in fullscreen)
window_width = 1920
window_height = 1080

# 0 = windowed, 1 = fullscreen, 2 = borderless fullscreen
fullscreen = 0

# Vertical sync: 0 = off, 1 = on
vsync = 0

# Max FPS: 60, 120, 240, or 0 for uncapped
max_fps = 180

# Anti-aliasing samples: 0 = off, 2, 4, or 8
msaa = 8

# Texture filtering: 0 = nearest-neighbor, 1 = use the game's filtering
texture_filtering = 1

[Enhancements]
# Preload HD textures at startup: 0 = off (load on demand), 1 = preload, 2 = preload + cache file (fastest)
preload_textures = 1

[Gameplay]
# Disable Mr. Resetti: 0 = normal, 1 = disable
disable_resetti = 0

# Shop upgrade visitor requirement (Nookington's needs a shopper from another town): 0 = required, 1 = not required
disable_shop_visitor_req = 0

# Borderless acres: 0 = original acre transitions (faster, draws less), 1 = continuous movement/camera
borderless_acres = 0

# NES emulator aspect ratio: 0 = stretch to fullscreen, 1 = 4:3 pillarbox
nes_aspect = 1

[Audio]
# Master output volume as a percentage (0-100)
master_volume = 100

[Input]
# Gamepad stick deadzones as a percentage (0-40)
stick_deadzone = 12
cstick_deadzone = 12
